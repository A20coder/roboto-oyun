name: APK Derle

# Her push'ta ve elle tetiklemeyle çalışır
on:
  push:
  workflow_dispatch:

jobs:
  build-android:
    # Ubuntu 24.04 (ubuntu-latest) autotools'u libffi reçetesini bozuyor → 22.04'e sabitle
    runs-on: ubuntu-22.04
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          # Hedef Python ile aynı sürüm — Pygame longintrepr.h uyumu için
          python-version: '3.10.12'

      - name: Sistem bağımlılıkları
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev

      - name: Buildozer kur
        run: |
          python -m pip install --upgrade pip
          pip install buildozer "cython==0.29.36"

      - name: Android SDK lisanslarını kabul et + APK derle (debug)
        run: |
          set -o pipefail
          yes | buildozer android debug 2>&1 | tee build.log

      - name: Hata olursa asıl hatayı göster
        if: failure()
        run: |
          echo "=================== HATA SATIRLARI ==================="
          grep -nE "\[ERROR\]|Build failed|Traceback|fatal error|error:|No such file|FAILED|Aidl not found|RuntimeError|ModuleNotFound" build.log \
            | grep -vEi "warning|discards qualifiers" | tail -n 60 || echo "(anahtar kelime bulunamadi)"
          echo "=================== SON 250 SATIR ==================="
          tail -n 250 build.log

      - name: Tam derleme logunu yükle (her durumda)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: APK'yı yükle (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: roboto-apk
          path: bin/*.apk
          if-no-files-found: error
